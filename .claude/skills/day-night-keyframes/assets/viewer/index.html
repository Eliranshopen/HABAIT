<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>יום ולילה · PoC</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #fff; --dim: rgba(255,255,255,.62); --glass: rgba(18,16,14,.42); --line: rgba(255,255,255,.22); --acc: #f2c48d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0c0b; color: var(--ink); font: 14px/1.35 system-ui, "Segoe UI", Arial, sans-serif; overflow: hidden; overscroll-behavior: none; }
  #pano { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; transition: opacity .35s; }
  #pano:active { cursor: grabbing; } #pano.fade { opacity: .25; transition: none; }
  .chip { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; }
  header { position: fixed; top: max(12px, env(safe-area-inset-top)); inset-inline: 16px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
  header > * { pointer-events: auto; padding: 8px 12px; }
  #brand b { letter-spacing: .08em; } #room { color: var(--dim); font-size: 12px; display: block; }
  #badge { font-size: 12px; align-self: flex-start; }
  #light { position: fixed; inset-inline-start: 16px; bottom: calc(68px + env(safe-area-inset-bottom)); width: min(340px, calc(100% - 32px)); padding: 12px 14px; }
  #light .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 600; direction: ltr; unicode-bidi: isolate; }
  #hour { width: 100%; margin: 10px 0 4px; accent-color: var(--acc); direction: ltr; height: 28px; }
  .ticks { display: flex; justify-content: space-between; direction: ltr; }
  .ticks button { all: unset; cursor: pointer; font-size: 12px; color: var(--dim); padding: 6px 2px; min-height: 32px; }
  .ticks button:hover, .ticks button:focus-visible { color: var(--ink); }
  #play { all: unset; cursor: pointer; width: 32px; height: 32px; text-align: center; border-radius: 50%; border: 1px solid var(--line); }
  #mixinfo { font-size: 11px; color: var(--dim); direction: ltr; unicode-bidi: isolate; }
  label.lin { font-size: 11px; color: var(--dim); display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  #tabs { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; max-width: calc(100% - 32px); overflow-x: auto; scrollbar-width: none; }
  #tabs button { all: unset; cursor: pointer; white-space: nowrap; padding: 10px 12px; border-radius: 9px; color: var(--dim); }
  #tabs button.here { color: var(--ink); } #tabs button:hover { background: rgba(255,255,255,.08); }
  #hotspots { position: fixed; inset: 0; pointer-events: none; }
  .hs { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; color: #fff; font: inherit; font-size: 12px; padding: 8px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(8px); }
  #err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  #err[hidden] { display: none; }
  #mixinfo { margin-top: 2px; border-top: 1px solid var(--line); padding-top: 6px; }
  .noui header, .noui #light, .noui #tabs, .noui #hotspots { display: none; }
  @media (max-width: 600px) { #light { bottom: calc(64px + env(safe-area-inset-bottom)); } #brand { max-width: 60%; } }
</style>
</head>
<body>
<canvas id="pano" aria-label="תמונת 360 — גררו כדי להסתכל מסביב"></canvas>
<div id="hotspots"></div>
<header>
  <div id="brand" class="chip"><b>HABAIT</b> · מעבדה <span id="room"></span></div>
  <div id="badge" class="chip">הדמיה · CG render</div>
</header>
<section id="light" class="chip" aria-label="שעה ביום">
  <div class="row"><strong>שעה ביום · Explore the light</strong><span id="clock">14:00</span><button id="play" aria-label="נגן יום שלם">▶</button></div>
  <input id="hour" type="range" min="6" max="22" step="0.01" value="14" aria-label="שעה">
  <div class="ticks"><button data-hour="7">בוקר</button><button data-hour="13">צהריים</button><button data-hour="18">שקיעה</button><button data-hour="21.5">לילה</button></div>
  <div id="mixinfo"></div>
  <label class="lin"><input type="checkbox" id="linear"> ערבוב באור ליניארי (linear-light mix)</label>
</section>
<nav id="tabs" class="chip" aria-label="נקודות מבט"></nav>
<div id="err" hidden>WebGL לא זמין בדפדפן הזה.</div>
<script src="daynight.js"></script>
</body>
</html>
