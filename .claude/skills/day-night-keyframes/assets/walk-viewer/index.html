<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דגם חצב · יום ולילה</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink:#1d1d1b; --paper:#f6f3ee; --accent:#a87a4f; }
  html, body { margin:0; height:100%; overflow:hidden; background:#cfd6da; font-family:system-ui,"Segoe UI",Arial,sans-serif; touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas { display:block; width:100vw; height:100vh; outline:none; }
  .badge { position:fixed; top:max(12px,env(safe-area-inset-top)); inset-inline-start:12px; z-index:5; background:rgba(20,20,18,.74); color:#fff; padding:7px 11px; border-radius:9px; font-size:12.5px; line-height:1.35; }
  .badge b { display:block; font-size:15px; }
  #room { position:fixed; top:max(12px,env(safe-area-inset-top)); inset-inline-end:12px; z-index:5; background:rgba(246,243,238,.9); color:var(--ink); padding:8px 13px; border-radius:9px; font:600 15px/1.2 inherit; }
  #hint { position:fixed; bottom:calc(74px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:5; background:rgba(20,20,18,.66); color:#fff; padding:7px 12px; border-radius:9px; font-size:13px; text-align:center; max-width:min(92vw,620px); transition:opacity .6s; }
  #hint small { display:block; opacity:.8; font-size:11px; margin-top:2px; }
  nav { position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; gap:6px; overflow-x:auto; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,rgba(0,0,0,.45)); scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:0 0 auto; border:0; border-radius:10px; padding:8px 13px; min-height:44px; background:rgba(246,243,238,.9); color:var(--ink); font:600 14px/1.1 inherit; cursor:pointer; }
  nav button.on { background:var(--accent); color:#fff; }
  #load { position:fixed; inset:0; z-index:9; display:grid; place-content:center; gap:12px; background:#ece8e1; color:var(--ink); font-size:15px; text-align:center; }
  #load .bar { width:min(320px,70vw); height:6px; background:#d8d2c8; border-radius:3px; overflow:hidden; }
  #prog { width:0; height:100%; background:var(--accent); transition:width .2s; }
  #fade { position:fixed; inset:0; z-index:4; background:#ece8e1; opacity:0; pointer-events:none; transition:opacity .28s; }
  .hidden { display:none !important; }
  #light { position:fixed; z-index:6; top:max(12px,env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(380px,calc(100vw - 32px)); box-sizing:border-box; background:rgba(246,243,238,.92); color:var(--ink); border-radius:12px; padding:8px 12px; font-size:13px; }
  #light .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #clock { font-variant-numeric:tabular-nums; font-weight:700; direction:ltr; unicode-bidi:isolate; }
  #play { border:1px solid #cfc7ba; background:transparent; border-radius:50%; width:34px; height:34px; cursor:pointer; color:var(--ink); }
  #hour { width:100%; direction:ltr; accent-color:var(--accent); margin:4px 0 0; }
  #ticks { display:flex; justify-content:space-between; direction:ltr; }
  #ticks button { border:0; background:none; color:#5c574f; font:inherit; font-size:12px; padding:6px 2px; min-height:32px; cursor:pointer; }
  #mixinfo { font-size:11px; color:#6d675e; direction:ltr; unicode-bidi:isolate; }
  .noui .badge, .noui #room, .noui #hint, .noui nav, .noui #light { display:none !important; }
  @media (max-width: 900px) { #light { top:auto; bottom:calc(66px + env(safe-area-inset-bottom)); } #hint { bottom:calc(196px + env(safe-area-inset-bottom)); } }
  @media (max-width: 640px) { #room { top:calc(max(12px,env(safe-area-inset-top)) + 58px); inset-inline-end:auto; inset-inline-start:12px; font-size:14px; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }</script>
</head>
<body>
<div id="load"><div>טוען את הבית…</div><div class="bar"><div id="prog"></div></div></div>
<div class="badge"><b>הדמיה · CG render</b>דגם חצב · 3 חדרים · 80 מ"ר · מושב נעמה</div>
<div id="room"></div>
<div id="hint"></div>
<div id="fade"></div>
<div id="light"><div class="row"><strong>שעה ביום</strong><span id="mixinfo"></span><span id="clock">--:--</span><button id="play" aria-label="נגן יום שלם">▶</button></div>
<input id="hour" type="range" step="0.05" aria-label="שעה ביום"><div id="ticks"></div></div>
<nav id="nav"></nav>
<script type="module" src="./walk.js"></script>
</body>
</html>
