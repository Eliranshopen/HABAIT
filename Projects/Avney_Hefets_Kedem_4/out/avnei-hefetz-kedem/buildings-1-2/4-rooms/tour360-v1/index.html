    renderChange();
    if (state.ready) renderVideoBar();
    const curCard = cards[s.index].btn;
    // the strip scrolls ITSELF to centre the current card — scrollIntoView would also scroll every ancestor that can scroll, the clipped
    // tour root included, and in RTL that pushes the place card off the right edge (Eliran's 1741 px screenshot, 2026-11-08)
    { const st = $('t-strip'), cr = curCard.getBoundingClientRect(), sr = st.getBoundingClientRect();
      try { st.scrollBy({ left: (cr.left + cr.width / 2) - (sr.left + sr.width / 2), behavior: reduced || !state.ready ? 'auto' : 'smooth' }); } catch (_) { st.scrollLeft += (cr.left + cr.width / 2) - (sr.left + sr.width / 2); } }
  }

  function showLoading(on, text, final) {
    const box = $('t-loading');
    box.classList.toggle('is-final', Boolean(on && final)); // T18j: a final message shows no spinner
    if (on) {
      $('t-loading-text').textContent = text || (firstLoad ? ui('loadingFirst') : ui('loadingRoom').replace('{room}', nameOf(byId[state.scene])));
      box.classList.toggle('is-small', !firstLoad);

    } else {

    }
  }
  function showError() {
    state.applying = false;
    showLoading(false);
    $('t-error-text').textContent = ui('error');
    $('t-retry').textContent = ui('tryAgain');
    $('t-error').hidden = false;
  }

  function syncUrl() {
    try {
      const u = new URL(window.location.href);
      u.searchParams.set('room', state.scene);
      if (lang === 'he') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang);
      const ids = activeIds(state.scene);
      if (ids.length) u.searchParams.set('change', ids.join(',')); else u.searchParams.delete('change');
      if (look === 'original') u.searchParams.set('look', 'original'); else u.searchParams.delete('look'); // card Q09
      if (floor && floors.length > 1) u.searchParams.set('floor', floor); else u.searchParams.delete('floor');
      window.history.replaceState(null, '', u);
    } catch (_) { /* file:// or a sandbox: the URL is a convenience only */ }
  }

  /* the way back to the project level: in scope=apartment an outside link (`return`, the flyover); otherwise, from a room, the
     hold node of this tour's own project layer. The pack's `backToBuilding` wording when it has one; the skip pill likewise. */
  const WORDS = { backToBuilding: { he: 'חזרה לבניין', en: 'Back to the building', fr: "Retour à l'immeuble" }, skipIntro: { he: 'דלג', en: 'Skip', fr: 'Passer' } };
  const word = (k) => ui(k) || WORDS[k][lang] || WORDS[k].he;
  function renderReturn(s) {
    const r = $('t-return');
    const inRoom = !s.exterior && holdId && scope !== 'apartment';
    r.hidden = !(returnUrl || inRoom);
    // embedded (the platform's apartment page puts the tour in an iframe, card 23): the way back must replace the PAGE, not the frame
    if (returnUrl) { r.href = returnUrl; r.onclick = null; if (window.self !== window.top) r.target = '_top'; else r.removeAttribute('target'); }
    else if (inRoom) { r.href = '#'; r.onclick = (e) => { e.preventDefault(); autoOff = true; go(holdId); }; }
    r.textContent = word('backToBuilding');
    const k = $('t-skip'); k.hidden = !(auto.running && holdId); k.textContent = word('skipIntro');
  }

  /* ── the automatic passages (2026-11-02): a scene with `autoNext` moves on by itself after `autoDwellMs` — the intro orbit of the
     project (aerial → o1…o5 → the hold at the tower) and, after the tap on the apartment, the descent (45 m → 25 m → facade →
     outside the terrace → the sun terrace). The buyer looks around meanwhile: the view direction is carried from node to node.
     Choosing a card, an arrow or a pin means browsing by hand: the automatics stop until the next door tap. `?auto=0` disables. */
  const auto = { timer: 0, running: false };
  let autoOff = params.get('auto') === '0';
  function autoArm() {
    window.clearTimeout(auto.timer);
    const s = byId[state.scene];
    const next = s && s.autoNext && byId[s.autoNext];
    auto.running = Boolean(next) && !autoOff;
    if (!auto.running) { if (state.ready) renderReturn(s); return; }
    renderReturn(s);
    auto.timer = window.setTimeout(() => {
      if (autoOff || !viewer || roomOf(viewer.getScene()) !== s.id) return;
      // outside, the look direction is carried (the tower stays where the eye left it); the last hop into a room faces the room
      if (next.exterior) viewer.loadScene(sceneKey(next.id), viewer.getPitch(), viewer.getYaw(), viewer.getHfov());
      else viewer.loadScene(sceneKey(next.id), -2, Number.isFinite(s.autoYaw) ? s.autoYaw : next.heading, fitHfov()); // autoYaw: the room's view, placed by hand
    }, Number.isFinite(s.autoDwellMs) ? s.autoDwellMs : 1000);
  }
  function autoSkip() { autoOff = true; window.clearTimeout(auto.timer); auto.running = false; if (holdId) go(holdId); }

  /* ── navigation ─────────────────────────────────────────────────────────────── */
  function go(id, byHand) {
    if (!viewer || !byId[id] || id === roomOf(viewer.getScene())) return;
    state.interacted = true;
    if (byHand) { autoOff = true; window.clearTimeout(auto.timer); auto.running = false; }
    viewer.loadScene(sceneKey(id), -2, byId[id].heading, fitHfov());
  }
  function step(delta) {
    const layer = layerScenes(byId[state.scene]);
    const i = (layer.indexOf(byId[state.scene]) + delta + layer.length) % layer.length;
    go(layer[i].id, true);
  }
  function setRotating(on) {
    state.rotating = Boolean(on) && !reduced;
    if (viewer) { if (state.rotating) viewer.startAutoRotate(-2.2); else viewer.stopAutoRotate(); }
    $('t-rotate').setAttribute('aria-pressed', String(state.rotating));
    if (!state.rotating) window.setTimeout(() => { if (!state.rotating) setMoving(false); }, 500); // T18k (F11): the rings stay on through the auto-rotate; a drag hides them
  }
  function setLang(next) {
    if (!LANGS.includes(next) || next === lang) return;
    lang = next;
    state.lang = next;
    renderStatic();
    renderRoom();
    syncUrl();
  }

  /* ── the sheets (floor plan · change panel) ─────────────────────────────────── */
  const SHEETS = ['t-sheet', 't-change'];
  let returnFocus = null;
  function openSheet(id, focusId) {
    closeSheet();
    returnFocus = document.activeElement;
    $(id).hidden = false;
    document.documentElement.classList.add('has-dialog'); // T18m (F16, D-CAT-26): the permanent lines rise above the backdrop
    if (id === 't-sheet') renderCone(); // card Q09: the cone as the view stands now
    placeSheet();
    $(focusId).focus({ preventScroll: true });
  }
  /** board habait-walkaround T15: the sheet starts below the concept line wherever it ends (two lines in he/fr, three in en);
      T19c (F-5): the plan then gives up height until all thirteen rooms are in view, as on the design link. T19d re-check: where
      even a 140 px plan cannot make them fit (a phone on its side, a small phone) the plan keeps its full size and the sheet
      scrolls, as the design link's does — a thin strip of a plan helped no one */
  function placeSheet() {
    document.documentElement.style.setProperty('--concept-bottom', Math.ceil($('tour-concept').getBoundingClientRect().bottom) + 'px');
    if ($('t-sheet').hidden) return;
    const panel = $('t-sheet').querySelector('.t-sheet-panel');
    const plan = $('t-plan');
    plan.style.maxHeight = 'none';
    const over = panel.scrollHeight - panel.clientHeight;
    const fit = Math.floor(plan.getBoundingClientRect().height - over);
    if (over > 0 && fit >= 140) plan.style.maxHeight = fit + 'px';
  }
  window.addEventListener('resize', () => { if (document.documentElement.classList.contains('has-dialog')) placeSheet(); });
  function closeSheet() {
    let was = false;
    for (const id of SHEETS) { if (!$(id).hidden) { $(id).hidden = true; was = true; } }
    document.documentElement.classList.remove('has-dialog');
    if (was && returnFocus && returnFocus.focus) returnFocus.focus({ preventScroll: true });
  }
  for (const n of document.querySelectorAll('[data-close]')) n.addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  /* ── the changes: compose the panorama, turn to the object, swap the scene ───── */
  const imgCache = new Map();
  function loadImage(src) {
    if (!imgCache.has(src)) {
      imgCache.set(src, new Promise((resolve, reject) => {
        const im = new Image();
        im.decoding = 'async';
        im.onload = () => resolve(im);
        im.onerror = () => { imgCache.delete(src); reject(new Error('image failed: ' + src)); };
        im.src = src;
      }));
    }
    return imgCache.get(src);
  }
  /** The room's current look as a canvas: the newest live edit (or the original) with the chosen patches drawn over it.
      Patch x/y/w/h are in balanced-panorama pixels; a live panorama has the same size. */
  async function composeCanvas(room, ids) {
    const s = byId[room];
    const defs = ids.map((id) => editDef(room, id)).filter(Boolean).sort((a, b) => a.order - b.order);
    const top = liveStack(room)[liveStack(room).length - 1];
    const imgs = await Promise.all([top ? Promise.resolve(top.img) : loadImage(panoPath(s.asset))].concat(defs.map((d) => loadImage('panos/patches/' + d.patch))));
    const base = imgs[0];
    const c = document.createElement('canvas');
    c.width = base.naturalWidth || base.width;
    c.height = base.naturalHeight || base.height;
    const g = c.getContext('2d');
    g.drawImage(base, 0, 0);
    const k = c.width / (data.panoWidth || c.width);
    defs.forEach((d, i) => g.drawImage(imgs[i + 1], d.x * k, d.y * k, d.w * k, d.h * k));
    return c;
  }
  const canvasToUrl = (c) => new Promise((resolve, reject) => c.toBlob((b) => (b ? resolve(URL.createObjectURL(b)) : reject(new Error('encode failed'))), 'image/jpeg', 0.92));
  async function composePano(room, ids) {
    const c = await composeCanvas(room, ids);
    const url = await canvasToUrl(c);
    c.width = 0;
    c.height = 0;
    return url;
  }
  /** Where to look so the changed object is in front of the visitor: a phone may widen by 15 degrees, a desktop by 6. */
  function aim(def) {
    const fit = fitHfov();
    return {
      pitch: (0.5 - def.look.v) * 180,
      yaw: (def.look.u - 0.5) * 360,
      hfov: Math.max(fit, Math.min(fit + (fine ? 6 : 15), (def.spanDeg || 60) + 12)),
    };
  }
  const canChange = () => Boolean(viewer) && state.ready && !state.applying && viewer.isLoaded() && look !== 'original';
  let applySeq = 0;
  async function applyRoom(room, focusDef, revert, keepText) {
    const seq = ++applySeq;
    const key = sceneKey(room);
    state.applying = true;
    state.interacted = true;
    if (state.rotating) setRotating(false);
    renderChange();
    showLoading(true, keepText || ui('changeApplying'));
    const target = focusDef ? aim(focusDef) : { pitch: viewer.getPitch(), yaw: viewer.getYaw(), hfov: viewer.getHfov() };
    const turned = new Promise((resolve) => {
      if (!focusDef || reduced) { resolve(); return; }
      let done = false;
      const fin = () => { if (!done) { done = true; resolve(); } };
      viewer.lookAt(target.pitch, target.yaw, target.hfov, 700, fin);
      window.setTimeout(fin, 1200);
    });
    try {
      if (key !== room && !composed[key]) {
        const url = await composePano(room, activeIds(room));
        if (composed[key]) URL.revokeObjectURL(url);
        else {
          composed[key] = url;
          viewer.addScene(key, Object.assign({}, pscenes[room], { panorama: url }));
        }
      }
      await turned;
      if (seq !== applySeq) return;
      retarget(room);
      if (viewer.getScene() === key) {
        state.applying = false;
        showLoading(false);
        renderChange();
        syncUrl();
        return;
      }
      viewer.loadScene(key, target.pitch, target.yaw, target.hfov);
    } catch (_) {
      if (seq !== applySeq) return;
      if (revert) revert();
      state.applying = false;
      retarget(room);
      renderChange();
      showLoading(true, ui('changeFailed'));
      window.setTimeout(() => { if (!state.applying) showLoading(false); }, 2600);
    }
  }
  function toggleEdit(room, id) {
    const def = editDef(room, id);
    if (!def || !canChange()) return;
    const prev = activeIds(room).slice();
    const ids = prev.slice();
    const i = ids.indexOf(id);
    if (i >= 0) ids.splice(i, 1); else ids.push(id);
    ids.sort(byOrder(room));
    active[room] = ids;
    const wasOriginal = Boolean(original[room]);
    original[room] = false;
    closeSheet();
    applyRoom(room, def, () => { active[room] = prev; original[room] = wasOriginal; });
  }
  function toggleOriginal() {
    const room = state.scene;
    if (!changeCount(room) || !canChange()) return;
    original[room] = !original[room];
    applyRoom(room, null, () => { original[room] = !original[room]; });
  }
  function dropLive(entries) {
    for (const e of entries) { try { URL.revokeObjectURL(e.url); } catch (_) { /* already gone */ } }
  }
  function resetEdits() {
    const room = state.scene;
    if (!changeCount(room) || !canChange()) return;
    const prev = activeIds(room).slice();
    const prevLive = liveStack(room).slice();
    const wasOriginal = Boolean(original[room]);
    active[room] = [];
    live[room] = [];
    original[room] = false;
    closeSheet();
    applyRoom(room, null, () => { active[room] = prev; live[room] = prevLive; original[room] = wasOriginal; });
  }
  /** A live change lands: the edited panorama (a canvas) becomes the room's new base for this session. */
  async function pushLive(room, canvas, label, meta) {
    const url = await canvasToUrl(canvas);
    const img = await loadImage(url);
    const entry = { url, img, label: String(label || '').slice(0, 120), meta: meta || {} };
    live[room] = liveStack(room).concat([entry]);
    original[room] = false;
    closeSheet();
    await applyRoom(room, null, () => { live[room] = liveStack(room).filter((e) => e !== entry); dropLive([entry]); }, ui('changeApplying'));
    return entry;
  }
  function undoLive(room) {
    const stack = liveStack(room);
    if (!stack.length || !canChange()) return;
    const popped = stack[stack.length - 1];
    live[room] = stack.slice(0, -1);
    closeSheet();
    // T18d: the entries this swap pushed onto OTHER rooms' stacks go with it, when they are still on top there
    for (const l of (popped.meta && Array.isArray(popped.meta.linked) ? popped.meta.linked : [])) {
      const st2 = liveStack(l.room); const top = st2[st2.length - 1];
      if (top && top.meta && top.meta.linked_to && top.meta.linked_to.room === room && l.ok !== false) { live[l.room] = st2.slice(0, -1); dropLive([top]); void ensureComposed(l.room); }
    }
    applyRoom(room, null, () => { live[room] = stack; }).then(() => { if (!liveStack(room).includes(popped)) dropLive([popped]); });
  }
  /** T18d: a room's edited scene composed and registered without loading it — the visitor stays where they are; entering the room
      finds it ready. Also the way a linked undo leaves the other room consistent. */
  async function ensureComposed(room) {
    const key = sceneKey(room);
    if (key === room || composed[key]) return;
    const url = await composePano(room, activeIds(room));
    if (composed[key]) { URL.revokeObjectURL(url); return; }
    composed[key] = url;
    viewer.addScene(key, Object.assign({}, pscenes[room], { panorama: url }));
    retarget(room);
  }
  /** T18d: a live change pushed onto a room that is NOT on screen (the follow-up of a swap seen from there). */
  async function pushLiveQuiet(room, canvas, label, meta) {
    const url = await canvasToUrl(canvas);
    const img = await loadImage(url);
    const entry = { url, img, label: String(label || '').slice(0, 120), meta: meta || {} };
    live[room] = liveStack(room).concat([entry]);
    original[room] = false;
    await ensureComposed(room);
    sweep(room);
    renderChange();
    return entry;
  }
  /** Drop the composed panoramas of this room that no state points at any more. */
  function sweep(room) {
    const keep = editedKey(room);
    const cur = viewer.getScene();
    for (const k of Object.keys(composed)) {
      if (roomOf(k) !== room || k === keep || k === cur) continue;
      viewer.removeScene(k);
      URL.revokeObjectURL(composed[k]);
      delete composed[k];
    }
  }

  /* ── wiring ─────────────────────────────────────────────────────────────────── */
  // Eliran 2026-11-04 (phone parity): at <=640 px only the current language shows (EN/FR ran off the screen); a tap on it moves to the next
  // the language (direction C): ONE button, the current language. Desktop: it opens a small list of the three under it; phone: a tap
  // moves to the next language (unchanged since 2026-11-04). Escape or a tap outside closes the list.
  const langBox = $('t-lang');
  const langOpen = (on) => { langBox.classList.toggle('is-open', on); for (const x of langBox.querySelectorAll('button')) if (x.dataset.lang === lang) x.setAttribute('aria-expanded', String(on)); else x.removeAttribute('aria-expanded'); };
  for (const b of document.querySelectorAll('#t-lang button')) b.addEventListener('click', () => {
    if (window.matchMedia('(max-width: 640px)').matches && b.dataset.lang === lang) { const order = [...document.querySelectorAll('#t-lang button')].map((x) => x.dataset.lang); setLang(order[(order.indexOf(lang) + 1) % order.length]); return; }
    if (b.dataset.lang === lang) { const open = !langBox.classList.contains('is-open'); if (open) { menuOpen(null); if (typeof closeDesign === 'function') closeDesign(false); } langOpen(open); return; }
    langOpen(false); setLang(b.dataset.lang);
    const cur = langBox.querySelector('button[aria-pressed="true"]'); if (cur) cur.focus({ preventScroll: true });
  });
  document.addEventListener('pointerdown', (e) => { if (langBox.classList.contains('is-open') && !langBox.contains(e.target)) langOpen(false); }, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && langBox.classList.contains('is-open')) { langOpen(false); const cur = langBox.querySelector('button[aria-pressed="true"]'); if (cur) cur.focus({ preventScroll: true }); } });
  for (const b of document.querySelectorAll('#t-look button')) b.addEventListener('click', () => setLook(b.dataset.look)); // card Q09
  // HUD clearance (Eliran 2026-11-04, a ring label cut under the typed bar): every 250 ms, a ring or room marker whose label box meets a
  // HUD control (the bar, the pick bar, the item card, the travel row, the strip, the two rails) fades out; it returns once the view
  // moves it clear. Cheap: ~60 rect reads, skipped while the tab is hidden.
  setInterval(() => {
    if (document.hidden) return;
    const hud = ['#t-change-bar', '#t-pick', '#t-item-card', '.t-travel > *', '#t-strip', '#t-tools', '#t-design', '#t-floor-seg', '#t-place', '.t-head > *', '#t-view', '#t-disclose']
      .flatMap((q) => [...document.querySelectorAll(q)]).filter((e) => !e.closest('[hidden]') && !e.closest('[inert]')).map((e) => e.getBoundingClientRect()).filter((r) => r.width > 0 && r.height > 0);
    const meets = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
    for (const h of document.querySelectorAll('.t-pano .t-mk, .t-pano .t-hs')) {
      const boxes = [h, ...h.querySelectorAll('*')].map((e) => e.getBoundingClientRect()).filter((r) => r.width > 0 && r.height > 0);
      h.classList.toggle('is-under-hud', boxes.length > 0 && boxes.some((r) => hud.some((q) => meets(r, q))));
    }
    const cx = innerWidth / 2, cy = innerHeight / 2, kept = [];
    const floorHs = [...document.querySelectorAll('.t-pano .t-hs-floor')].map((h) => ({ h, l: h.querySelector('.t-hs-label') })).filter((o) => o.l)
      .map((o) => { const r = o.h.getBoundingClientRect(); return { ...o, d: Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy) }; }).sort((a, b) => a.d - b.d);
    for (const o of floorHs) {
      if (o.h.classList.contains('is-under-hud')) continue;
      const r = o.l.getBoundingClientRect(); if (!r.width) continue;
      const pad = { left: r.left - 6, right: r.right + 6, top: r.top - 4, bottom: r.bottom + 4 };
      const quiet = kept.some((q) => meets(pad, q)) && !o.h.classList.contains('is-aim') && !o.h.matches(':hover, :focus-visible');
      o.h.classList.toggle('is-quiet', quiet); if (!quiet) kept.push(pad);
    }
  }, 250);
  // Eliran 2026-11-04 («גם בדסקטופ וגם בנייד»): on phones the right rail shows each switch as ONE button, its current value; a tap on it
  // moves to the next value (the same pattern as the language button). Capture phase: the active button's own handler never runs.
  for (const seg of [document.querySelector('#t-look .t-look-seg'), $('t-floor-seg')]) if (seg) seg.addEventListener('click', (e) => {
    if (!window.matchMedia('(max-width: 640px)').matches || seg.closest('#t-design')) return;
    const btn = e.target.closest('button');
    if (!btn || btn.getAttribute('aria-pressed') !== 'true') return;
    const all = [...seg.querySelectorAll('button')].filter((x) => !x.hidden && !x.disabled);
    if (all.length < 2) return;
    e.stopImmediatePropagation(); e.preventDefault();
    all[(all.indexOf(btn) + 1) % all.length].click();
  }, true);
  $('t-plan-btn').addEventListener('click', () => { viewOpen(false); if (dhOn) openDh(); else openSheet('t-sheet', 't-sheet-close'); });
  /* 2026-11-08 (Eliran: «…תחת כפתור ראשי "כלי עזר" ליד כפתור שינוי עיצוב… עוד כפתור… "סגנונות צפייה"»): two menus beside «שינוי עיצוב».
     Desktop: a small menu 8 px under its button (like the design panel); phone: a bottom sheet that ends above the AI strip. One menu at
     a time (the design panel and the language list close too); an outside tap or Esc closes it (focus back on its button); keyboard:
     the button is aria-expanded, the first item takes focus. «כלי עזר» lights while the ruler or the voice tour is on. */
  const phoneMq = window.matchMedia('(max-width: 640px)');
  const MENUS = { view: ['t-view-btn', 't-view'], tools: ['t-tools-btn', 't-tools-menu'] };
  const menuIsOpen = () => Object.keys(MENUS).find((k) => !$(MENUS[k][1]).hidden) || null;
  function menuPlace(name) {
    const [bId, mId] = MENUS[name]; const m = $(mId), btn = $(bId);
    if (phoneMq.matches) { m.style.left = m.style.right = m.style.top = ''; return; }
    const r = btn.getBoundingClientRect(), w = m.offsetWidth, M = 12, rtl = document.documentElement.dir === 'rtl';
    const left = Math.min(Math.max(M, rtl ? r.right - w : r.left), innerWidth - w - M);
    Object.assign(m.style, { top: `${Math.round(r.bottom + 8)}px`, left: `${Math.round(left)}px`, right: 'auto' });

      const crop = equiToPers(canvas, yaw, pitch, hfov, CROP_W, CROP_H);
      const cropJpeg = toJpeg(crop);
      if (account) account.before = cropJpeg; // T18j (F13): the wide "before" is cut after the answer, off the visitor's wait
      const apartment = tourData.id;
      // a catalog turn (T14e): the picked item and its photo ride with the words; the handler binds the photo to its catalog by hash
      const item = pick ? pick.item : null;
      const reference = item ? await referenceFor(item) : null;
      // the tapped piece in crop coordinates (T16c): its outlines projected into the crop, their box on 0-1000 for the handler
      let piece = null, oldPolys = null;
      let seen = null, fullBox = null, lift = null; // T18a: the piece as read on this crop, the fuller box, the crop sides it runs past
      if (marker) {
        oldPolys = marker.outlines.map((poly) => poly.map(([y, p]) => pixelOfDir(dirOf(y, p), view, CROP_W, CROP_H)).filter(Boolean).map((q) => [Math.max(0, Math.min(CROP_W, q.x)), Math.max(0, Math.min(CROP_H, q.y))])).filter((poly) => poly.length >= 3);
        const pts = oldPolys.flat();
        if (pts.length < 3) throw Object.assign(new Error('marker off view'), { uiKey: 'changeFailed', soft: true });
        const xs = pts.map((q) => q[0]), ys = pts.map((q) => q[1]);
        const box = [Math.min(...ys) / CROP_H, Math.min(...xs) / CROP_W, Math.max(...ys) / CROP_H, Math.max(...xs) / CROP_W].map((v) => Math.round(Math.max(0, Math.min(1, v)) * 1000));
        piece = { id: marker.id, category: marker.category, box, count: marker.count || 1 };
        fullBox = box.slice();
      }
      // One turn, a few attempts. A result is pasted only on evidence that the editor kept the composition:
      //  · anything but a living change: the border ring of the result matches the view (a re-framed photo moves it);
      //  · a living change by the people editor that leaves the ring alone and touches a small share of the view: that editor
      //    keeps untouched pixels exact, so the furniture cannot have been redrawn larger;
      //  · every other living result: the furniture judge (the same piece boxed in both views, compared in code);
      //  · a catalog turn by marker (T16c): the ring, then the replace judge — the old piece gone, the product in its place.
      // A refused result is never pasted; the next attempt is the handler's choice of editor. A surface change is not tested.
      const RING_SOFT = 0.15, RING_HARD = 0.30;  // held results measured 0–12 % of the ring, re-framed ones 16–59 %
      const JUDGE_OVER = 0.22;                   // people in place changed 12–14 % of the view; redrawn larger, 40–64 %
      const judgeFrame = async (resultJpeg) => {
        try {
          const jr = await fetch('api/edit', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ op: 'judge', code, apartment, scene: room, crop: cropJpeg, result: resultJpeg }),
            signal: AbortSignal.timeout(60000),
          });
          const j = await jr.json();
          return j && j.ok ? { held: j.held === true, iou: j.iou, ratio: j.ratio, object: j.object } : { held: false, error: (j && j.reason) || 'error' };
        } catch (_) { return { held: false, error: 'network' }; } // cannot tell: treat as not held, the other editor takes it
      };
      const replaceJudgeCall = async (resultJpeg) => {
        try {
          const jr = await fetch('api/edit', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ op: 'replace_judge', code, apartment, scene: room, item: item.id, crop: cropJpeg, result: resultJpeg, box: fullBox, count: piece.count }),
            signal: AbortSignal.timeout(60000),
          });
          const j = await jr.json();
          return j && j.ok ? { held: j.held === true, original_present: j.original_present, product_present: j.product_present, product_box: Array.isArray(j.product_box) ? clipBox(j.product_box, neighbourhood(fullBox)) : null, product_box_raw: j.product_box_raw ?? j.product_box ?? null, box_kept: j.box_kept ?? null, placed: j.placed, count: j.count, rest_unchanged: j.rest_unchanged, note: j.note } : { held: false, error: (j && j.reason) || 'error' };
        } catch (_) { return { held: false, error: 'network' }; }
      };
      // the likeness score of a catalog result (D-CAT-5): measured for the record, never a gate
      const likenessCall = async (resultJpeg) => {
        try {
          const lr = await fetch('api/edit', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ op: 'likeness', code, apartment, scene: room, item: item.id, reference, result: resultJpeg }),
            signal: AbortSignal.timeout(60000),
          });
          const l = await lr.json();
          return l && l.ok ? { score: l.score, found: l.found, why: l.why } : { error: (l && l.reason) || 'error' };
        } catch (_) { return { error: 'network' }; }
      };
      let out = null, A = null, ring = 0, attempt = 1, alpha = null, fraction = 0, judged = null;
      if (!opts.room) state.lastTurn = { text, attempts: [], error: null, ...(piece ? { piece, view: { yaw: Number(yaw.toFixed(2)), pitch: Number(pitch.toFixed(2)), hfov: Number(hfov.toFixed(1)) } } : {}) };
      else { state.lastTurn.followUps = state.lastTurn.followUps || []; state.lastTurn.followUps.push({ room, id: marker ? marker.id : null, attempts: [], view: { yaw: Number(yaw.toFixed(2)), pitch: Number(pitch.toFixed(2)), hfov: Number(hfov.toFixed(1)) } }); }
      for (;;) {
        // plan 2026-11-04-apt-furniture-swap: on habait-flow a cold function answered 502 within a second (no vendor call ran);
        // a gateway error that fast is retried twice, 1.5 s apart, before it counts as a failure
        const send = () => fetch('api/edit', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, apartment, scene: room, instruction: text, lang: hooks.lang(), crop: cropJpeg, view: { yaw, pitch, hfov }, attempt, ...(item ? { item: item.id, reference } : {}), ...(piece ? { piece } : {}) }),
          signal: AbortSignal.timeout(MAX_SECONDS * 1000),
        });
        let res = null;
        for (let tries = 0; ; tries++) {
          const t0 = Date.now();
          res = await send();
          if (!([502, 503, 504].includes(res.status) && Date.now() - t0 < 10000 && tries < 2)) break;
          await new Promise((r) => window.setTimeout(r, 1500));
        }
        out = await res.json().catch(() => ({ ok: false, reason: 'error' }));
        if (!out.ok) {
          // structure and view are the two reaches the scope can refuse (D-T360-24); a named real person has its own message (D-T360-26);
          // unsafe is the content rule; the rest are the host's
          const key = ['structure', 'view'].includes(out.reason) ? 'changeRefusedScope' : out.reason === 'real_person' ? 'changeRefusedRealPerson' : out.reason === 'unsafe' ? 'changeRefusedUnsafe'
            : out.reason === 'catalog' ? 'changeRefusedCatalog' : out.reason === 'unclear' ? 'changeRefusedUnclear' : out.reason === 'cap' ? 'changeCapReached' : out.reason === 'code' ? 'changeLocked' : 'changeFailed';
          throw Object.assign(new Error(out.reason || 'error'), { uiKey: key, soft: true });
        }
        // T16f (OQ-C12): an item turn the host did not take as a catalog turn (no `catalog: true` echo) is a failure, never a plain paste
        if (item && out.catalog !== true) throw Object.assign(new Error('catalog echo missing'), { uiKey: 'changeFailed', soft: true });
        if (out.slow) hooks.busy(true, ui('changeApplyingSlow'));
        if (piece && attempt === 1) {
          // T18a: the host read the piece on this crop; a box over the scan's box widens the region and the judge's neighbourhood
          const ps = acceptSeen(out.piece_seen, piece.box);
          if (ps) { seen = ps; fullBox = unionBox(piece.box, ps.box); }
          piece.seen = out.piece_seen && typeof out.piece_seen === 'object' ? out.piece_seen : null; // attempt 2 carries it; the record keeps it
          const edges = new Set(seen ? seen.touches_edge : []);
          if (fullBox[1] <= 12) edges.add('left'); if (fullBox[3] >= 988) edges.add('right'); if (fullBox[0] <= 12) edges.add('top'); if (fullBox[2] >= 988) edges.add('bottom');
          lift = { left: edges.has('left'), right: edges.has('right'), top: edges.has('top'), bottom: edges.has('bottom') };
          Object.assign(opts.room ? state.lastTurn.followUps[state.lastTurn.followUps.length - 1] : state.lastTurn, { piece_seen: piece.seen, seen_accepted: !!seen, full_box: fullBox, lift: [...edges] });
        }
        if (account && !account.before_wide) account.before_wide = toJpeg(equiToPers(canvas, yaw, pitch, wideHfov, CROP_W, CROP_H)); // the canvas is untouched until the paste
        hooks.busy(true, (opts.room ? ui('changeAlsoIn').replace('{room}', hooks.roomName(opts.room)) + ' · ' : '') + ui('changeStepChecking') + (attempt > 1 ? ' · ' + ui('changeAttemptOf').replace('{n}', String(attempt)).replace('{m}', String(out.living === true ? 3 : 2)) : '')); // T18j: the step
        const img = await loadImg(out.image);
        A = imageToData(img, CROP_W, CROP_H);
        // the colour fit matches the result to the crop on the untouched border ring; a surface change (a wall, the floor, the light)
        // legitimately changes that ring, so fitting would pull the new colour back toward the old one — skip it for that reach
        if (out.reach !== 'surface') colourFit(A, crop, CROP_W, CROP_H, 40);
        const tested = out.reach === 'object' || out.reach === 'view';
        // T18b (F2, OQ-C14): for a tapped piece the ring is measured outside the piece's neighbourhood; when the piece fills the ring,
        // the top band; when nothing of the ring lies outside the piece, the ring is skipped and the replace judge alone decides
        let rs = tested ? ringShare(A, crop, CROP_W, CROP_H, 40, 22, piece ? neighbourhood(fullBox) : null) : { share: 0, n: 1, total: 1 };
        let ringBand = piece ? 'outside' : 'ring';
        if (tested && piece && rs.n < rs.total * 0.15) { rs = ringShare(A, crop, CROP_W, CROP_H, 40, 22, neighbourhood(fullBox), 'top'); ringBand = 'top'; }
        if (tested && piece && rs.n < rs.total * 0.05) { rs = { share: 0, n: 0, total: rs.total }; ringBand = 'skipped'; }
        ring = rs.share;
        const mask = changedMask(A, crop, CROP_W, CROP_H, { thr: 22, close: 8, minArea: 100, pad: 5, lift });
        ({ alpha, fraction } = featherAlpha(mask, CROP_W, CROP_H, 6, lift));
        judged = null;
        let held = true;
        if (item && piece) {
          // a catalog turn by marker (T16c): the ring, then the replace judge — the product decides its own size; the branch is the
          // page's own item and piece, never the host's echo (T16f, OQ-C12)
          held = ring < RING_SOFT;
          if (held) { judged = await replaceJudgeCall(toJpeg(A)); held = judged.held; }
        } else if (item) {
          // a catalog turn without a marker (T14e): the ring, then the furniture judge every time
          held = ring < RING_SOFT;
          if (held) { judged = await judgeFrame(toJpeg(A)); held = judged.held; }
        } else if (tested && out.living === true && out.reach === 'object') {
          if (ring >= RING_HARD) held = false;
          // 2026-11-16: the fast editor (klein) is accepted on the same two numbers. It re-renders the whole view a little, so its
          // changed share reads HIGHER than nb2's for the same change (0.10–0.14 against 0.07 on the bench): the rule errs to the judge
          else if (['nb2', 'klein'].includes(out.modelKey) && ring < RING_SOFT && fraction <= JUDGE_OVER) held = true;
          else { judged = await judgeFrame(toJpeg(A)); held = judged.held; }
        } else if (tested) {
          held = ring < (out.reach === 'view' ? 0.35 : RING_SOFT);
        }
        (opts.room ? state.lastTurn.followUps[state.lastTurn.followUps.length - 1].attempts : state.lastTurn.attempts).push({ attempt, model: out.model, reach: out.reach, living: out.living === true, ring: Number(ring.toFixed(3)), ring_band: ringBand, ring_n: rs.n, ring_total: rs.total, fraction: Number(fraction.toFixed(3)), judge: judged, held, ms: out.ms ?? null, ms_text: out.ms_text ?? null, ms_edit: out.ms_edit ?? null });
        if (held) break;
        if (attempt >= (out.living === true ? 3 : 2)) {
          // T18l (F15, the judge's J-14): a catalog turn names what refused it — the ring, or the replace judge's own finding — and reads
          // its own line (`catalogRefused`, his words; the plain `changeFailed` until they land), never the typed change's «different angle»
          const reason = judged && judged.held === false ? (judged.original_present ? 'judge:original_present' : judged.placed === false ? 'judge:not_placed' : judged.product_present === false ? 'judge:no_product' : 'judge') : 'ring';
          throw Object.assign(new Error('refused: ' + reason), { uiKey: item ? (ui('catalogRefused') ? 'catalogRefused' : 'changeFailed') : 'changeReframed', soft: true, reason });
        }
        attempt++;
        hooks.busy(true, ui('changeRetrying') + ' · ' + ui('changeAttemptOf').replace('{n}', String(attempt)).replace('{m}', String(out.living === true ? 3 : 2)));
      }
      if (fraction < 0.002) throw Object.assign(new Error('no difference'), { uiKey: 'changeNoDiff', soft: true });
      let likeness = null;
      if (item) { likeness = await likenessCall(toJpeg(A)); (opts.room ? state.lastTurn.followUps[state.lastTurn.followUps.length - 1] : state.lastTurn).likeness = likeness; }
      // the paste stays inside the piece (T16c): the changed region ∩ (the old outlines ∪ the product's box, clipped to the piece's
      // neighbourhood — T16f), widened 12 px at half-res,
      // so what the editor touched elsewhere never reaches the panorama
      let regionFraction = null;
      if (piece) {
        // T18a: the region = the scan's outline ∪ the piece as read on this crop (its silhouette and its box) ∪ the judge's product box
        // (clipped to the fuller box's neighbourhood) ∪ a pad under the box for the legs' ends and the shadow — still the piece's own
        // neighbourhood and nothing else (D-CAT-20)
        const polys = oldPolys.slice();
        if (seen) {
          if (seen.outline) polys.push(seen.outline.map(([y, x]) => [(x / 1000) * CROP_W, (y / 1000) * CROP_H]));
          polys.push(boxPoly(seen.box, CROP_W, CROP_H));
        }
        if (judged && judged.product_box) polys.push(boxPoly(judged.product_box, CROP_W, CROP_H));
        const above = Math.min(PAD_ABOVE_MAX, (PAD_ABOVE[marker && marker.category] || 0) * (fullBox[2] - fullBox[0]));
        polys.push(boxPoly([Math.max(0, fullBox[0] - above), fullBox[1], Math.min(1000, fullBox[2] + PAD_BELOW), fullBox[3]], CROP_W, CROP_H));
        const region = polyMask(polys, CROP_W, CROP_H, 12);
        const ra = featherAlpha({ m: region.m, hw: region.hw, hh: region.hh }, CROP_W, CROP_H, 6, lift).alpha;
        let kept = 0;
        for (let i = 0; i < alpha.length; i++) { alpha[i] = (alpha[i] * ra[i]) / 255; if (alpha[i] > 127) kept++; }
        regionFraction = Number(region.fraction.toFixed(3));
        const rec = opts.room ? state.lastTurn.followUps[state.lastTurn.followUps.length - 1] : state.lastTurn;
        rec.region_fraction = regionFraction;
        rec.pasted_fraction = Number((kept / alpha.length).toFixed(3));
      }
      // the crop becomes "crop with the change": project only where alpha says
      hooks.busy(true, ui('changeStepPlacing')); // T18j
      persToEquiBlend(canvas, A, alpha, yaw, pitch, hfov);
      if (account) { account.after = toJpeg(equiToPers(canvas, yaw, pitch, hfov, CROP_W, CROP_H)); account.after_wide = toJpeg(equiToPers(canvas, yaw, pitch, wideHfov, CROP_W, CROP_H)); account.ok = true; }
      // the marker after the swap (OQ-C10): onto the product's box, named after the item; undo falls back through the stack
      let markerMeta = null;
      if (piece && marker) {
        const pb = judged && judged.product_box ? judged.product_box : fullBox;
        const corners = boxPoly(pb, CROP_W, CROP_H).map(([x, y]) => { const d = dirOfPixel(x, y, view, CROP_W, CROP_H); return [Number(norm(yawOf(d)).toFixed(2)), Number(pitchOf(d).toFixed(2))]; });
        const cd = dirOfPixel(((pb[1] + pb[3]) / 2000) * CROP_W, ((pb[0] + pb[2]) / 2000) * CROP_H, view, CROP_W, CROP_H);
        markerMeta = { id: marker.id, before: { yaw: marker.yaw, pitch: marker.pitch, outlines: marker.outlines, count: marker.count, item: marker.item || null }, after: { yaw: Number(norm(yawOf(cd)).toFixed(2)), pitch: Number(pitchOf(cd).toFixed(2)), outlines: [corners], count: judged && judged.count ? judged.count : marker.count, item: item.id } };
      }
      const meta = { prompt: out.prompt, model: out.model, reach: out.reach, living: out.living === true, attempt, ring: Number(ring.toFixed(3)), judge: judged, usd: out.usd, fraction: Number(fraction.toFixed(3)), ...(item ? { item: item.id, likeness } : {}), ...(piece ? { piece, region_fraction: regionFraction } : {}), ...(markerMeta ? { marker: markerMeta } : {}), ...(opts.linked_to ? { linked_to: opts.linked_to } : {}) };
      const entry = opts.room ? await hooks.pushLiveQuiet(room, canvas, text, meta) : await hooks.pushLive(room, canvas, text, meta);
      canvas.width = 0; canvas.height = 0;
      if (!opts.room && state.lastTurn) state.lastTurn.ms_total = Date.now() - t0; // request → the picture on screen
      // 2026-11-16: a typed change of a thing inside the view goes on to every other scene that sees the spot — in the background,
      // under the host's signed copy of this turn's instruction (an older host sends none, and nothing follows)
      if (!pick && !opts.room && followOn && out.follow && out.reach === 'object') void followTyped({ room, entry, text, token: out.follow, living: out.living === true, result: A }, alpha, view, state.lastTurn);
      if (pick && !opts.room) closePick();
      renderItemCard();
      // T18d (D-CAT-27): the same piece seen from other scenes — one follow-up turn per scene, onto that room's stack, quietly
      if (!opts.room && marker && marker.piece) {
        const others = hooks.samePiece(marker.piece, room, marker.id);
        const linked = [];
        for (const o of others) {
          const stB = hooks.markerState(o.room, o.id);
          if (!stB || stB.category !== item.category) continue;
          const r = await runChange(text, { item, marker: stB }, { room: o.room, linked_to: { room, id: marker.id } }).catch((e) => ({ ok: false, key: 'error', error: String(e && e.message || e).slice(0, 120) }));
          linked.push({ room: o.room, id: o.id, ok: Boolean(r && r.ok), ...(r && r.key ? { key: r.key } : {}), ...(r && r.reason ? { reason: r.reason } : {}) });
        }
        if (linked.length) {
          entry.meta.linked = linked;
          state.lastTurn.linked = linked;
          const failed = linked.filter((l) => !l.ok);
          if (failed.length) {
            hooks.busy(true, ui('changeAlsoFailed').replace('{room}', failed.map((l) => hooks.roomName(l.room)).join(', ')), true);
            window.setTimeout(() => { if (state.applying) hooks.busy(false); }, 5000);
          } else hooks.busy(false);
          hooks.renderChange();
        }
      }
      // T18f (the judge's J-09): after a swap the view re-aims so the product's new ring sits at 38 % of the viewport's height — above
      // the bottom stack and the card, where a second tap finds it (the chair set's ring had moved down under the undo pill)
      if (markerMeta && markerMeta.after && !opts.room) {
        try {
          const hf = viewer.getHfov();
          const vf = (2 * Math.atan(Math.tan((hf * Math.PI) / 360) * (window.innerHeight / Math.max(1, window.innerWidth))) * 180) / Math.PI;
          viewer.lookAt(Math.max(-55, Math.min(55, markerMeta.after.pitch + 0.12 * vf)), markerMeta.after.yaw, hf, hooks.reduced() ? false : 500);
        } catch (_) { /* the view stays */ }
      }
      return { ok: true };
    } catch (e) {
      const key = e && e.uiKey ? e.uiKey : 'changeFailed';
      if (opts.room) {
        // a failed follow-up: recorded, said for its room by the caller; the swap on screen stands
        if (state.lastTurn) state.lastTurn.error = { key, reason: e && e.reason ? e.reason : null, room: opts.room, message: String(e && e.message || e).slice(0, 200) };
        if (account) { account.ok = false; account.message = { key, reason: e && e.reason ? e.reason : null, text: ui(key), error: String(e && e.message || e).slice(0, 200) }; }
        return { ok: false, key, reason: e && e.reason ? e.reason : null };
      }
      if (pick) closePick();
      if (state.lastTurn) state.lastTurn.error = { key, reason: e && e.reason ? e.reason : null, message: String(e && e.message || e).slice(0, 200) };
      hooks.busy(true, ui(key), true); // T18j: a final message carries no spinner — and it shows before the record's wide cut
      if (account) {
        account.ok = false;
        account.message = { key, reason: e && e.reason ? e.reason : null, text: ui(key), error: String(e && e.message || e).slice(0, 200) };
        if (!account.before_wide && canvas) { try { account.before_wide = toJpeg(equiToPers(canvas, yaw, pitch, wideHfov, CROP_W, CROP_H)); } catch (_) { /* no wide view for this record */ } }
      }
      // a message stays long enough to read: about 70 ms a character, between 3.2 and 8 seconds
      window.setTimeout(() => { if (!state.applying) return; hooks.busy(false); }, Math.max(3200, Math.min(8000, String(ui(key) || '').length * 70)));
      return { ok: false, key };
    } finally {
      if (timer) window.clearInterval(timer);
      input.disabled = false; apply.disabled = false;
      hooks.renderChange();
      if (account) void postRecord(account, { room, view: { yaw: Number(yaw.toFixed(2)), pitch: Number(pitch.toFixed(2)), hfov: Number(hfov.toFixed(1)) }, wide_hfov: wideHfov, item: pick && pick.item ? pick.item.id : null, marker: marker ? marker.id : null, ms: Date.now() - t0 });
    }
  }

  ready().then(async (h) => {
    hooks = h;
    let info = null;
    try { info = await (await fetch('api/edit', { cache: 'no-store', headers: { 'X-Tour-Code': code } })).json(); } catch (_) { info = null; }
    // T18i (F9): the host answers `configured` only for the right code — a wrong link keeps the field as "soon" and the rings hidden,
    // and no crop is ever cut for it
    if (openProbe && !(info && info.open === true && info.configured)) return; // a closed host and no code: the page stays as it was
    if (!info || !info.configured) { state.lockReason = info && info.reason === 'code' ? 'code' : 'keys'; return; }
    unlocked = true;
    recording = info.record === true; // T17a: only the laptop host says so
    state.recording = recording;
    followOn = info.follow === true && typeof h.place === 'function'; // 2026-11-16: the host answers follow turns and the page can place a spot
    h.setUnlocked();
    document.addEventListener('tour:change', () => { if (state.pick && state.pick.room !== hooks.room()) closePick(); renderItemCard(); });
    document.addEventListener('tour:marker', (e) => openPick(e.detail));
    $('t-pick-close').addEventListener('click', closePick);
    const cardClose = $('t-item-close');
    if (cardClose) cardClose.addEventListener('click', () => { state.cardClosed = { room: hooks.room(), n: ((state.liveMeta && state.liveMeta[hooks.room()]) || []).length }; renderItemCard(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !pickBox.hidden) closePick(); });
    renderItemCard();
    showHint();
    const submit = () => { const text = input.value.trim(); if (text.length < 2 || !hooks.canChange()) return; input.value = ''; input.blur(); runChange(text); };
    form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
    // 2026-11-16: the depth maps a follow needs are asked for when the visitor first turns to the typed field, not at page load
    if (followOn) input.addEventListener('focus', () => { for (const id of hooks.rooms()) if (hooks.place(id)) void hooks.depthFor(id); }, { once: true });
    state.liveReady = true;
  });
})();
</script>
</body>
