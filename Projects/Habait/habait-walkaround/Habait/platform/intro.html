<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habait · טיסה</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .intro-ui { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 2; }
  .intro-title { color: #fff; font: 600 15px/1.3 system-ui, sans-serif; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .intro-skip { background: rgba(10,16,30,.7); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 8px 16px; font: 500 14px system-ui, sans-serif; cursor: pointer; }
  .intro-fade { position: fixed; inset: 0; background: #000; opacity: 0; transition: opacity .6s; pointer-events: none; z-index: 3; }
  .intro-tap { position: fixed; inset: 0; display: none; place-items: center; z-index: 4; color: #fff; font: 600 18px system-ui, sans-serif; background: rgba(0,0,0,.45); }
</style>
</head>
<body>
<video id="v" muted playsinline autoplay preload="auto"></video>
<div class="intro-ui"><div class="intro-title" id="title"></div><button class="intro-skip" id="skip">דלג</button></div>
<div class="intro-fade" id="fade"></div>
<div class="intro-tap" id="tap">הקישו כדי להתחיל את הטיסה</div>
<script type="module">
  // Step 1 of the flow: a rendered flight clip (orbit when ready; interim = the realistic approach), then the hold (step 2).
  const q = new URLSearchParams(location.search);
  const project = q.get('project') || 'rainbow';
  const next = q.get('next') || `flow.html?project=${encodeURIComponent(project)}`;
  const lang = q.get('lang') === 'en' ? 'en' : 'he';
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  const v = document.getElementById('v'), fade = document.getElementById('fade'), tap = document.getElementById('tap');
  document.getElementById('skip').textContent = lang === 'he' ? 'דלג' : 'Skip';
  const list = await (await fetch('projects.json', { cache: 'no-cache' })).json();
  const p = list.projects.find((x) => x.id === project) || list.projects[0];
  const meta = await (await fetch(`${p.dir}/project.json`, { cache: 'no-cache' })).json();
  const clip = q.get('clip') || (meta.exterior && meta.exterior.intro && meta.exterior.intro.clip);
  document.getElementById('title').textContent = (meta.name && meta.name[lang]) || p.id;
  let done = false;
  const go = () => { if (done) return; done = true; fade.style.opacity = 1; setTimeout(() => { location.href = next; }, 600); };
  document.getElementById('skip').onclick = go;
  if (!clip) { go(); } else {
    v.src = `${p.dir}/${clip}`;
    v.addEventListener('ended', go);
    v.addEventListener('error', go);
    v.play().catch(() => { tap.style.display = 'grid'; tap.onclick = () => { tap.style.display = 'none'; v.play().catch(go); }; });
  }
  window.__habaitIntro = { get next() { return next; }, get clip() { return clip; } };
</script>
</body>
</html>
