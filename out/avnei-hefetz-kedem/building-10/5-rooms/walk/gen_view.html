<!doctype html><html><head><meta charset="utf-8"><title>model check</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }</script></head>
<body style="margin:0;background:#e9e6e1"><script type="module">
// $0 look at a generated model (19_fal_3d.py): ?m=gen_bed_parents, ?a=angle in degrees
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search), m = q.get('m'), ang = THREE.MathUtils.degToRad(+(q.get('a') || 30));
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0xe9e6e1); s.add(new THREE.HemisphereLight(0xffffff, 0x999999, 2.0)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 4, 3); s.add(d);
const g = (await new GLTFLoader().loadAsync(`./models/${m}/${m}${m.startsWith("hy_") ? ".web" : ""}.glb`)).scene; s.add(g); g.traverse((o) => { if (o.isMesh && o.material) { o.material.metalness = 0; o.material.needsUpdate = true; } });
if (q.get("nolid")) g.traverse((o) => { if (o.isMesh) { const bb = new THREE.Box3().setFromObject(o), s = bb.getSize(new THREE.Vector3()); if (bb.min.y > 2.0 || (s.y < 0.15 && bb.min.y > 1.5)) o.visible = false; } });
const b = new THREE.Box3().setFromObject(g), c = b.getCenter(new THREE.Vector3()), z = b.getSize(new THREE.Vector3()).length();
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 200); const top = q.get("top"); if (top) { cam.position.set(c.x, c.y + z * 1.4, c.z + 0.001); } else cam.position.set(c.x + Math.sin(ang) * z * 1.3, c.y + z * 0.5, c.z + Math.cos(ang) * z * 1.3); cam.lookAt(c);
r.render(s, cam); window.done = true;
</script></body></html>
